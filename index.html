<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Bar Book</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Bar Book">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f6f9;--card:#ffffff;--card-hover:#f8fafc;--gold:#b86a10;--gold-dim:#8a5010;--text:#111827;--text-dim:#6b7280;--accent:#f3f4f6;--border:#e5e7eb;--success:#059669;--danger:#dc2626;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{background:var(--bg);min-height:100vh;padding-top:var(--safe-top);padding-bottom:calc(60px + var(--safe-bottom))}
h1,h2,h3{font-family:'Playfair Display',serif}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 16px 8px;padding-top:calc(12px + var(--safe-top));border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,.06)}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.header h1{font-size:1.4rem;color:var(--text);letter-spacing:-.3px;font-weight:700}
.header-actions{display:flex;gap:6px;align-items:center}
.unit-toggle{display:flex;background:var(--accent);border-radius:9px;padding:2px;gap:2px;flex-shrink:0}
.unit-opt{padding:4px 9px;font-size:.72rem;font-weight:600;color:var(--text-dim);background:none;border:none;cursor:pointer;border-radius:7px;transition:all .15s;line-height:1}
.unit-opt.active{background:var(--text);color:#fff}
/* Action buttons row */
.action-row{display:flex;gap:7px;margin-bottom:10px}
.header-btn{background:var(--accent);border:none;color:var(--text-dim);height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .2s;padding:0 13px;font-size:.78rem;font-weight:500;font-family:'Inter',sans-serif;white-space:nowrap}
.header-btn svg{width:15px;height:15px;flex-shrink:0}
.header-btn.active{background:rgba(184,106,16,.12);color:var(--gold);}
.header-btn.active svg{stroke:var(--gold)}
.header-btn-menu{background:var(--text);color:#fff;flex:1;justify-content:center;font-weight:600;font-size:.82rem}
.header-btn-menu svg{stroke:#fff;width:16px;height:16px}
.header-btn-menu.active{background:var(--gold)}
/* Favorites badge */
.nav-tab{position:relative}
.nav-badge{position:absolute;top:5px;right:calc(50% - 20px);background:var(--gold);color:#fff;border-radius:8px;font-size:.58rem;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;line-height:1.4;display:none}
.nav-badge.visible{display:block}

/* Search */
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;background:var(--accent);border:1px solid transparent;border-radius:12px;color:var(--text);font-size:.9rem;outline:none;transition:all .2s}
.search-wrap input:focus{background:#fff;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,106,16,.1)}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:1rem}

/* View Toggle */
.view-toggle{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.view-toggle::-webkit-scrollbar{display:none}
.view-btn{flex-shrink:0;padding:8px 13px 7px;background:var(--accent);border:none;color:var(--text-dim);font-size:.62rem;font-weight:500;cursor:pointer;transition:all .2s;text-align:center;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:50px;letter-spacing:.2px}
.view-btn svg{width:16px;height:16px;flex-shrink:0}
.view-btn.active{background:var(--text);color:#fff;}

/* Category pills */
.pills{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;-ms-overflow-style:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:6px 14px;background:var(--accent);border:1px solid transparent;border-radius:20px;color:var(--text-dim);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s;flex-shrink:0}
.pill.active{background:var(--text);color:#fff;border-color:var(--text)}

/* Difficulty chips */
.diff-row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.diff-chip{padding:4px 10px;border-radius:10px;font-size:.7rem;font-weight:500;cursor:pointer;border:1px solid transparent;color:var(--text-dim);background:var(--accent);transition:all .2s}
.diff-chip.active{background:var(--text);color:#fff}

/* Flavor tags */
.flavor-row{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.flavor-row::-webkit-scrollbar{display:none}
.flavor-tag{white-space:nowrap;padding:4px 12px;border-radius:20px;font-size:.68rem;background:var(--accent);color:var(--text-dim);cursor:pointer;transition:all .2s;border:1px solid transparent;flex-shrink:0}
.flavor-tag.active{background:var(--gold);color:#fff;}

/* Cards Grid */
.cards{padding:8px 16px 20px;display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.cards{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.cards{grid-template-columns:1fr 1fr 1fr}}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:all .25s;transform:scale(1);box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card:active{transform:scale(.97)}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:#d1d5db}
.card.highlight{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,106,16,.2)}
.card-top{padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:flex-start}
.card-info h3{font-size:1.05rem;color:var(--text);margin-bottom:3px}
.card-info p{font-size:.78rem;color:var(--text-dim);line-height:1.4}
.card-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:8px;font-size:.65rem;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.badge-cat{background:rgba(154,107,30,.12);color:var(--gold)}
.badge-diff{background:rgba(0,0,0,.06);color:var(--text-dim)}
.badge-diff.easy{color:#16a34a}.badge-diff.medium{color:#d97706}.badge-diff.hard{color:#dc2626}
.badge-bb{background:rgba(154,107,30,.2);color:var(--gold);font-style:italic}
.card-fav{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-dim);transition:all .2s;padding:4px;flex-shrink:0}
.card-fav.active{color:#ef4444}

/* Card expanded */
.card-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.card.open .card-body{max-height:2000px}
.card-detail{padding:0 16px 16px}
.info-boxes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.info-box{background:var(--bg);border-radius:12px;padding:10px;text-align:center;border:1px solid var(--border)}
.info-box .label{font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:4px}
.info-box .value{font-size:.82rem;font-weight:500;color:var(--text)}
.info-box .icon{font-size:1.3rem;margin-bottom:2px}
.section-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);margin:12px 0 8px;font-weight:600}
.ingredient{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.1);font-size:.85rem}
.ingredient .name{color:var(--text)}.ingredient .amount{color:var(--gold);font-weight:500;white-space:nowrap}
.ingredient.optional .name{color:var(--text-dim);font-style:italic}
.step{display:flex;gap:10px;padding:8px 0;font-size:.83rem;color:var(--text)}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;flex-shrink:0}
.step-text{line-height:1.5}
.flavor-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.flavor-pill{padding:3px 8px;border-radius:8px;font-size:.65rem;background:rgba(154,107,30,.1);color:var(--gold-dim)}
.tag-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag-pill{padding:3px 8px;border-radius:8px;font-size:.65rem;background:rgba(0,0,0,.05);color:var(--text-dim)}

/* Index View */
.index-view{padding:8px 16px 20px;display:none}
.index-view.active{display:block}
.cards-view{display:grid}.cards-view.hidden{display:none}
.index-letter{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold);padding:12px 0 6px;border-bottom:1px solid var(--border);margin-top:8px}
.index-item{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,0,0,.07);cursor:pointer;transition:background .15s}
.index-item:active{background:var(--accent)}
.index-item .name{font-size:.9rem;font-weight:500}
.index-item .cat{font-size:.72rem;color:var(--text-dim);text-transform:capitalize}

/* Category Index */
.cat-view{padding:8px 16px 20px;display:none}
.cat-view.active{display:block}
.cat-header{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--gold);padding:14px 0 6px;border-bottom:1px solid var(--border);text-transform:capitalize;margin-top:6px}
.cat-item{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,0,0,.07);cursor:pointer;transition:background .15s}
.cat-item:active{background:var(--accent)}
.cat-item .name{font-size:.88rem;font-weight:500}
.cat-item .diff{font-size:.7rem}

/* Pantry Feature */
.pantry-section{padding:0 16px 12px;display:none}
.pantry-section.active{display:block}
.pantry-input-row{display:flex;gap:6px;margin-bottom:8px}
.pantry-input{flex:1;padding:8px 12px;background:var(--accent);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.85rem;outline:none}
.pantry-input:focus{border-color:var(--gold)}
.pantry-add-btn{padding:8px 16px;background:var(--gold);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:.85rem;cursor:pointer}
.pantry-items{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.pantry-item{padding:4px 10px;background:rgba(154,107,30,.12);color:var(--gold);border-radius:8px;font-size:.75rem;display:flex;align-items:center;gap:4px;cursor:pointer}
.pantry-item .remove{font-weight:bold}
.match-pct{font-size:.7rem;color:var(--success);font-weight:600;margin-left:auto;padding-left:8px}

/* Favorites View */
.fav-view{padding:8px 16px 20px;display:none}
.fav-view.active{display:block}
.fav-empty{text-align:center;padding:60px 20px}
.fav-empty .icon{font-size:3rem;margin-bottom:12px}
.fav-empty h3{font-size:1.1rem;color:var(--text);margin-bottom:8px}
.fav-empty p{font-size:.85rem;color:var(--text-dim);line-height:1.5}
.fav-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.fav-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.fav-grid{grid-template-columns:1fr 1fr 1fr}}

/* No results */
.no-results{text-align:center;padding:40px 20px;color:var(--text-dim)}
.no-results h3{font-size:1.1rem;margin-bottom:8px;color:var(--text)}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding-bottom:var(--safe-bottom);display:flex;z-index:100;height:calc(58px + var(--safe-bottom))}
.nav-tab{flex:1;padding:9px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:.62rem;font-weight:500;transition:all .2s;letter-spacing:.2px}
.nav-tab svg{width:22px;height:22px}
.nav-tab.active{color:var(--gold)}
.nav-tab.active svg{stroke:var(--gold)}
.cards-count{padding:8px 16px 4px;font-size:.78rem;color:var(--text-dim);font-weight:400}

/* Vibe row */
.vibe-row{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.vibe-row::-webkit-scrollbar{display:none}
.vibe-chip{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:500;cursor:pointer;background:var(--accent);border:1px solid transparent;color:var(--text-dim);transition:all .2s;flex-shrink:0}
.vibe-chip.active{background:var(--text);color:#fff}

/* Cocktail of the Week */
.cotw-wrap{padding:12px 16px 4px}
.cotw{background:linear-gradient(135deg,#1c1208 0%,#2d1e08 100%);border-radius:16px;padding:16px 16px 14px;position:relative;overflow:hidden}
.cotw::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(184,120,30,.15)}
.cotw-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(184,120,30,.8);margin-bottom:6px}
.cotw-name{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.2}
.cotw-reason{font-size:.8rem;color:rgba(255,255,255,.65);margin-bottom:10px;line-height:1.4}
.cotw-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cotw-flavors{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.cotw-flavor{padding:3px 9px;border-radius:10px;font-size:.68rem;background:rgba(184,120,30,.2);color:rgba(184,120,30,.9)}
.cotw-btn{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cotw-dismiss{position:absolute;top:10px;right:12px;background:none;border:none;color:rgba(255,255,255,.4);font-size:1rem;cursor:pointer;padding:2px 6px;line-height:1}
.cotw-collapsed{background:var(--accent);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.cotw-collapsed-label{font-size:.8rem;color:var(--text-dim);font-weight:500}
.cotw-collapsed-name{font-size:.85rem;font-weight:600;color:var(--text)}

/* Share button */
.card-share{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--text-dim);padding:4px;transition:all .2s;flex-shrink:0;opacity:.6}
.card-share:active{opacity:1;transform:scale(1.15)}
.card-actions{display:flex;align-items:center;gap:2px}

/* Menu Studio */
.studio-modal{position:fixed;inset:0;background:#fff;z-index:300;display:none;flex-direction:column;overflow:hidden}
.studio-modal.open{display:flex}
.studio-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.studio-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700}
.studio-close{background:var(--accent);border:none;border-radius:10px;padding:8px 14px;font-size:.85rem;font-weight:500;cursor:pointer}
.studio-body{flex:1;overflow-y:auto;padding:20px 16px 32px}
.studio-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--accent);border-radius:12px;padding:3px}
.studio-tab{flex:1;padding:8px;background:none;border:none;border-radius:9px;font-size:.82rem;font-weight:500;cursor:pointer;color:var(--text-dim);transition:all .18s}
.studio-tab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.occasion-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.occasion-chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:.82rem;cursor:pointer;transition:all .15s;color:var(--text-dim);white-space:nowrap}
.occasion-chip.active{border-color:var(--gold);background:rgba(184,106,16,.06);color:var(--text)}
.studio-input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:.9rem;font-family:'Inter',sans-serif;outline:none;resize:none;background:#fafafa;transition:border-color .2s;box-sizing:border-box}
.studio-input:focus{border-color:var(--gold);background:#fff}
.studio-generate-btn{width:100%;margin-top:12px;padding:14px;background:var(--text);color:#fff;border:none;border-radius:13px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.studio-generate-btn:disabled{opacity:.5;cursor:default}
.studio-loading{text-align:center;padding:40px 20px}
.studio-loading-icon{font-size:2.5rem;animation:spin 1.5s linear infinite;display:inline-block;margin-bottom:12px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.studio-loading-text{font-size:.9rem;color:var(--text-dim)}
.ai-result{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ai-menu-header{text-align:center;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:20px}
.ai-menu-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--text);margin-bottom:4px}
.ai-menu-subtitle{font-size:.85rem;color:var(--text-dim);margin-bottom:10px}
.ai-menu-note{font-size:.82rem;color:var(--text-dim);line-height:1.5;background:var(--accent);border-radius:10px;padding:10px 12px}
.ai-section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);margin:20px 0 10px}
.ai-cocktail-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.ai-cocktail-name{font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;color:var(--text);margin-bottom:3px}
.ai-cocktail-meta{font-size:.72rem;color:var(--gold);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.ai-cocktail-note{font-size:.8rem;color:var(--text-dim);line-height:1.4;margin-bottom:8px}
.ai-cocktail-actions{display:flex;gap:6px}
.ai-go-btn{padding:5px 12px;background:var(--text);color:#fff;border:none;border-radius:8px;font-size:.75rem;font-weight:500;cursor:pointer}
.ai-add-menu-btn{padding:5px 12px;background:var(--accent);color:var(--text);border:1.5px solid var(--border);border-radius:8px;font-size:.75rem;font-weight:500;cursor:pointer}
.ai-special-badge{display:inline-block;padding:2px 8px;background:rgba(184,106,16,.12);color:var(--gold);border-radius:6px;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.ai-ingredients{margin:8px 0;padding:8px 10px;background:var(--accent);border-radius:8px}
.ai-ingredient{display:flex;justify-content:space-between;font-size:.78rem;padding:2px 0;color:var(--text)}
.ai-ingredient-amount{color:var(--gold);font-weight:500}
.studio-print-btn{width:100%;margin-top:16px;padding:13px;background:var(--gold);color:#fff;border:none;border-radius:13px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}

/* Menu mode */
.card.menu-selectable{cursor:pointer}
.card.menu-selectable .card-top{position:relative}
.menu-check{position:absolute;top:0;right:36px;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;transition:all .2s;flex-shrink:0}
.card.menu-selected .menu-check{background:var(--gold);border-color:var(--gold);color:#fff}
.card.menu-selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,106,16,.2)}

/* Menu floating bar */
.menu-bar{position:fixed;bottom:calc(60px + var(--safe-bottom) + 10px);left:16px;right:16px;background:var(--text);color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.menu-bar.visible{display:flex}
.menu-bar-label{font-size:.88rem;font-weight:500}
.menu-bar-btn{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:.85rem;font-weight:600;cursor:pointer}

/* Twist Feature */
.twist-area{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.twist-btn{width:100%;padding:11px;background:linear-gradient(135deg,#1c1208,#2d1e08);color:rgba(255,255,255,.9);border:none;border-radius:12px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;letter-spacing:.2px}
.twist-btn:hover{opacity:.88}
.twist-btn:disabled{opacity:.5;cursor:default}
.twist-loading{text-align:center;padding:16px 0;color:var(--text-dim);font-size:.82rem}
.twist-loading-icon{display:inline-block;animation:spin 1.2s linear infinite;margin-right:6px}
.twist-result{margin-top:10px;background:linear-gradient(135deg,#1c1208 0%,#2d1e08 100%);border-radius:14px;padding:16px;color:#fff;animation:fadeIn .35s ease}
.twist-result-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:3px}
.twist-result-tagline{font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:12px;font-style:italic;line-height:1.4}
.twist-changes-title{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:rgba(184,120,30,.8);margin-bottom:7px}
.twist-change{background:rgba(255,255,255,.06);border-radius:9px;padding:9px 11px;margin-bottom:6px}
.twist-change-row{display:flex;align-items:center;gap:6px;font-size:.8rem;margin-bottom:3px;flex-wrap:wrap}
.twist-change-orig{color:rgba(255,255,255,.5);text-decoration:line-through;font-size:.77rem}
.twist-change-arrow{color:rgba(184,120,30,.7);font-size:.75rem}
.twist-change-new{color:rgba(255,255,255,.9);font-weight:600}
.twist-change-reason{font-size:.75rem;color:rgba(255,255,255,.5);line-height:1.4}
.twist-new-step{margin-top:8px;font-size:.78rem;color:rgba(255,255,255,.65);background:rgba(255,255,255,.05);border-radius:8px;padding:8px 10px;line-height:1.5}
.twist-new-step-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.6px;color:rgba(184,120,30,.7);margin-bottom:3px;font-weight:700}
.twist-note{margin-top:10px;font-size:.78rem;color:rgba(255,255,255,.55);line-height:1.55;font-style:italic;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}

/* Menu modal */
.menu-modal{position:fixed;inset:0;background:#fff;z-index:300;display:none;flex-direction:column;overflow:hidden}
.menu-modal.open{display:flex}
.menu-modal-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#fff}
.menu-modal-actions{display:flex;gap:8px}
.menu-close-btn{background:var(--accent);border:none;border-radius:10px;padding:8px 14px;font-size:.85rem;font-weight:500;cursor:pointer;color:var(--text)}
.menu-print-btn{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:.85rem;font-weight:600;cursor:pointer}

/* Printable menu page */
.menu-scroll{flex:1;overflow-y:auto;padding:24px 20px;background:#f4f6f9}
.menu-page{max-width:680px;margin:0 auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 32px rgba(0,0,0,.1)}
.menu-page-header{padding:36px 36px 24px;text-align:center;border-bottom:2px solid #111827}
.menu-page-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:#111827;letter-spacing:-.5px;margin-bottom:4px}
.menu-title-input{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:#111827;letter-spacing:-.5px;border:none;outline:none;text-align:center;width:100%;background:transparent;margin-bottom:4px}
.menu-subtitle-input{font-size:.9rem;color:#6b7280;border:none;outline:none;text-align:center;width:100%;background:transparent;font-family:'Inter',sans-serif}
.menu-divider{width:60px;height:2px;background:var(--gold);margin:16px auto}
.menu-items{padding:24px 36px 36px}
.menu-item{padding:16px 0;border-bottom:1px solid #f3f4f6}
.menu-item:last-child{border-bottom:none}
.menu-item-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.menu-item-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;color:#111827}
.menu-item-cat{font-size:.75rem;font-weight:500;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
.menu-item-desc{font-size:.83rem;color:#6b7280;line-height:1.5}
.menu-item-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.menu-item-tag{padding:2px 8px;border-radius:6px;font-size:.65rem;background:#f3f4f6;color:#6b7280}

/* Print */
@media print{
  body>*:not(#studioModal){display:none!important}
  #studioModal{position:static!important;display:block!important}
  .studio-header{display:none!important}
  .menu-scroll{overflow:visible;padding:0;background:#fff}
  .menu-page{box-shadow:none;border-radius:0;max-width:100%;page-break-inside:avoid}
  .menu-title-input,.menu-subtitle-input{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .menu-page-header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .menu-item{page-break-inside:avoid}
  .menu-divider{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#b86a10!important}
  @page{margin:15mm;size:A4}
}

/* Servings Scaler */
.scaler{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:9px 12px;background:var(--accent);border-radius:10px}
.scaler-label{font-size:.75rem;font-weight:500;color:var(--text-dim)}
.scaler-btns{display:flex;gap:3px}
.scaler-btn{padding:5px 11px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:.75rem;font-weight:600;cursor:pointer;color:var(--text-dim);transition:all .15s}
.scaler-btn.active{background:var(--text);color:#fff;border-color:var(--text)}

/* Mood View */
.mood-view{display:none;padding:16px 16px 24px}
.mood-view.active{display:block}
.mood-section-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);margin-bottom:10px;margin-top:20px}
.mood-section-label:first-child{margin-top:0}
.season-chips{display:flex;gap:8px}
.season-chip{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .18s;color:var(--text-dim);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.season-chip.active{background:var(--text);border-color:var(--text);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mood-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mood-chip{padding:12px 10px;border-radius:14px;border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all .18s;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.mood-chip.active{border-color:var(--gold);background:rgba(184,106,16,.05);box-shadow:0 2px 10px rgba(184,106,16,.12)}
.mood-chip-emoji{font-size:1.3rem;display:block;margin-bottom:4px}
.mood-chip-name{font-size:.82rem;font-weight:600;color:var(--text);display:block}
.mood-chip-hint{font-size:.7rem;color:var(--text-dim);display:block;margin-top:2px;line-height:1.3}
.mood-recs-bar{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}
.mood-recs-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--text)}
.mood-recs-count{font-size:.78rem;color:var(--text-dim);background:var(--accent);padding:3px 10px;border-radius:20px}
.mood-recs-empty{text-align:center;padding:32px 20px;color:var(--text-dim);font-size:.9rem}
.mood-clear{font-size:.75rem;color:var(--gold);font-weight:500;cursor:pointer;padding:2px 0;background:none;border:none}

/* Scrollbar */
::-webkit-scrollbar{width:0;height:0}
</style>

function scaleAmount(str,s){
  if(!s||s===1)return str;
  return str.replace(/^(\d+(?:\.\d+)?)/,(_,n)=>{
    const v=Math.round(parseFloat(n)*s*4)/4;
    return v%1===0?String(v):(v*100%25===0?(Math.floor(v)+' '+(['','¼','½','¾'][Math.round((v%1)*4)])).trim():v.toFixed(2).replace(/\.?0+$/,''));
  });
}
function ozToMl(n){
  const ml=parseFloat(n)*30;
  if(ml<15)return+(Math.round(ml*2)/2)+' ml';   // nearest 0.5ml (e.g. 7.5ml)
  return Math.round(ml/5)*5+' ml';               // nearest 5ml (e.g. 60ml, 45ml)
}
function convertUnit(str,s){
  let r=scaleAmount(str,s||1);
  if(useMl)r=r.replace(/(\d+(?:\.\d+)?)\s*oz\b/gi,(_,n)=>ozToMl(n));
  return r;
}

function getWeekCocktail(){
  const now=new Date();
  const weekNum=Math.floor(now.getTime()/(7*24*60*60*1000));
  let pool=cocktails, reason='', holidayCtx=null;
  for(const h of HOLIDAYS_IL){
    const from=new Date(h.from),to=new Date(h.to);
    const daysBefore=(from-now)/(1000*60*60*24);
    if((now>=from&&now<=to)||(daysBefore>=0&&daysBefore<=10)){holidayCtx=h;break}
  }
  if(holidayCtx){
    const hf=holidayCtx.flavor||[];
    const matched=cocktails.filter(c=>hf.some(f=>(c.flavor||[]).includes(f)));
    if(matched.length>=3){pool=matched;reason=holidayCtx.hint}
  }
  if(!reason){
    const season=getCurrentSeason();
    const sObj=SEASONS.find(s=>s.id===season);
    if(sObj){const m=cocktails.filter(c=>sObj.match(c));if(m.length>=3)pool=m}
    const labels={spring:'Perfect for a spring evening 🌸',summer:'Beat the heat this summer ☀️',fall:'Cozy fall evening 🍂',winter:'Warm you up this winter ❄️'};
    reason=labels[season]||'This week\'s pick';
  }
  return{cocktail:pool[weekNum%pool.length],reason};
}

    `<div class="mood-recs-empty" style="padding-top:40px">Pick a season or mood<br>to get your cocktail recommendations ✨</div>`;
  el.innerHTML=seasonHTML+moodHTML+recsHTML;
  el.querySelectorAll('.season-chip').forEach(chip=>chip.onclick=()=>{activeSeason=activeSeason===chip.dataset.season?null:chip.dataset.season;renderMoodView()});
  el.querySelectorAll('.mood-chip').forEach(chip=>chip.onclick=()=>{activeMood=activeMood===chip.dataset.mood?null:chip.dataset.mood;renderMoodView()});
}

// Get all categories, flavors
const categories=['all',...[...new Set(cocktails.map(c=>c.category))]];
const allFlavors=[...new Set(cocktails.flatMap(c=>c.flavor||[]))].sort();
const difficulties=['easy','medium','hard'];

// Render category pills
function renderPills(){const el=document.getElementById('categoryPills');el.innerHTML=categories.map(c=>`<div class="pill${activeCategory===c?' active':''}" data-cat="${c}">${c==='all'?'All':c.charAt(0).toUpperCase()+c.slice(1)}</div>`).join('');el.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{activeCategory=p.dataset.cat;renderPills();renderAll()})}

// Render difficulty chips
function renderDiffs(){const el=document.getElementById('diffRow');el.innerHTML=difficulties.map(d=>`<div class="diff-chip${activeDifficulty===d?' active':''}" data-diff="${d}">${d.charAt(0).toUpperCase()+d.slice(1)}</div>`).join('');el.querySelectorAll('.diff-chip').forEach(p=>p.onclick=()=>{activeDifficulty=activeDifficulty===p.dataset.diff?null:p.dataset.diff;renderDiffs();renderAll()})}

// Render flavor tags
function renderFlavors(){const el=document.getElementById('flavorRow');el.innerHTML=allFlavors.map(f=>`<div class="flavor-tag${activeFlavor===f?' active':''}" data-fl="${f}">${f}</div>`).join('');el.querySelectorAll('.flavor-tag').forEach(p=>p.onclick=()=>{activeFlavor=activeFlavor===p.dataset.fl?null:p.dataset.fl;renderFlavors();renderAll()})}
function renderVibes(){const el=document.getElementById('vibeRow');el.innerHTML=VIBES.map(v=>`<div class="vibe-chip${activeVibe===v.id?' active':''}" data-vibe="${v.id}">${v.label}</div>`).join('');el.querySelectorAll('.vibe-chip').forEach(chip=>chip.onclick=()=>{activeVibe=activeVibe===chip.dataset.vibe?null:chip.dataset.vibe;renderVibes();renderAll()})}

// Filter cocktails
function filtered(){let list=cocktails;if(showBarBook)list=list.filter(c=>(c.tags||[]).includes('bar-book'));if(showFavs)list=list.filter(c=>favorites.has(c.id));if(activeCategory!=='all')list=list.filter(c=>c.category===activeCategory);if(activeDifficulty)list=list.filter(c=>c.difficulty===activeDifficulty);if(activeFlavor)list=list.filter(c=>(c.flavor||[]).includes(activeFlavor));if(activeVibe){const v=VIBES.find(x=>x.id===activeVibe);if(v)list=list.filter(c=>v.match(c))}if(searchQuery){const q=searchQuery.toLowerCase();list=list.filter(c=>c.name.toLowerCase().includes(q)||c.description.toLowerCase().includes(q)||(c.ingredients||[]).some(i=>i.name.toLowerCase().includes(q))||(c.category||'').toLowerCase().includes(q))}if(showPantry&&pantryItems.size>0){list=list.map(c=>{const req=c.ingredients.filter(i=>i.required);const matched=req.filter(i=>Array.from(pantryItems).some(p=>i.name.toLowerCase().includes(p.toLowerCase())||p.toLowerCase().includes(i.name.toLowerCase().split(' ').pop())));return{...c,matchPct:Math.round(matched.length/req.length*100)}}).filter(c=>c.matchPct>0).sort((a,b)=>b.matchPct-a.matchPct)}return list}

// Render card
function cardHTML(c){const ice=detectIce(c);const ge=glassEmoji[c.glass]||'🍸';const isFav=favorites.has(c.id);const isOpen=openCards.has(c.id);
return`<div class="card${isOpen?' open':''}" id="card-${c.id}" data-id="${c.id}">
<div class="card-top" onclick="toggleCard('${c.id}')">
<div class="card-info"><h3>${c.name}</h3><p>${c.description}</p>
<div class="card-badges">${(c.tags||[]).includes('bar-book')?'<span class="badge badge-bb">Bar Book</span>':''}<span class="badge badge-cat">${c.category}</span><span class="badge badge-diff ${c.difficulty}">${c.difficulty}</span>${c.matchPct?`<span class="match-pct">${c.matchPct}% match</span>`:''}</div></div>
<div class="card-actions"><button class="card-share" onclick="event.stopPropagation();shareCard('${c.id}')" title="Share">📤</button><button class="card-fav${isFav?' active':''}" onclick="event.stopPropagation();toggleFav('${c.id}')">${isFav?'❤️':'♡'}</button></div></div>
<div class="card-body"><div class="card-detail">
<div class="info-boxes"><div class="info-box"><div class="icon">${ge}</div><div class="label">Glass</div><div class="value">${c.glass}</div></div>
<div class="info-box"><div class="icon">🧊</div><div class="label">Ice</div><div class="value">${ice}</div></div>
<div class="info-box"><div class="icon">🌿</div><div class="label">Garnish</div><div class="value">${c.garnish||'None'}</div></div></div>
<div class="scaler"><span class="scaler-label">Servings</span><div class="scaler-btns">${[1,2,4,8].map(s=>`<button class="scaler-btn${(cardScalers[c.id]||1)===s?' active':''}" onclick="event.stopPropagation();setScale('${c.id}',${s})">×${s}</button>`).join('')}</div></div><div class="section-title">Ingredients</div>${(c.ingredients||[]).map(i=>`<div class="ingredient${i.required?'':' optional'}"><span class="name">${i.name}${i.required?'':' (optional)'}</span><span class="amount">${convertUnit(i.amount,cardScalers[c.id]||1)}</span></div>`).join('')}
<div class="section-title">Method</div>${(c.steps||[]).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div class="step-text">${s.instruction}</div></div>`).join('')}
<div class="section-title">Flavor Profile</div><div class="flavor-pills">${(c.flavor||[]).map(f=>`<span class="flavor-pill">${f}</span>`).join('')}</div>
<div class="section-title">Tags</div><div class="tag-pills">${(c.tags||[]).map(t=>`<span class="tag-pill">${t}</span>`).join('')}</div>
<div class="twist-area"><button class="twist-btn" id="twist-btn-${c.id}" onclick="event.stopPropagation();getTwist('${c.id}')">✦ Suggest a Twist</button><div id="twist-${c.id}"></div></div>
</div></div></div>`}

function shareCard(id){
  const c=cocktails.find(x=>x.id===id);if(!c)return;
  const url=`${location.origin}${location.pathname}?c=${id}`;
  if(navigator.share){navigator.share({title:c.name,text:`${c.name} — ${c.description}`,url}).catch(()=>{})}
  else{navigator.clipboard.writeText(url).then(()=>{const b=document.querySelector(`#card-${id} .card-share`);if(b){const orig=b.textContent;b.textContent='✓';setTimeout(()=>b.textContent=orig,1500)}}).catch(()=>{})}
}
// Deep link: ?c=cocktail-id
(function(){const p=new URLSearchParams(location.search).get('c');if(p)setTimeout(()=>scrollToCard(p),400)})();
function toggleCard(id){if(openCards.has(id))openCards.delete(id);else openCards.add(id);renderAll()}
function toggleFav(id){if(favorites.has(id))favorites.delete(id);else favorites.add(id);saveFavs();renderAll()}

// Suggest a Twist
async function getTwist(id){
  const c=cocktails.find(x=>x.id===id);if(!c)return;
  const btn=document.getElementById('twist-btn-'+id);
  const resultEl=document.getElementById('twist-'+id);
  if(!btn||!resultEl)return;
  btn.disabled=true;btn.textContent='✦ Generating twist...';
  resultEl.innerHTML='<div class="twist-loading"><span class="twist-loading-icon">⟳</span>Consulting the bartender...</div>';
  try{
    const res=await fetch('/api/twist',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:c.name,category:c.category,description:c.description,ingredients:c.ingredients,steps:c.steps})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const d=await res.json();
    if(d.error)throw new Error(d.error);
    const changes=(d.changes||[]).map(ch=>`<div class="twist-change"><div class="twist-change-row"><span class="twist-change-orig">${ch.original||''}</span><span class="twist-change-arrow">→</span><span class="twist-change-new">${ch.replacement||''}</span></div><div class="twist-change-reason">${ch.reason||''}</div></div>`).join('');
    const newStep=d.new_step?`<div class="twist-new-step"><div class="twist-new-step-label">New Step</div>${d.new_step}</div>`:'';
    resultEl.innerHTML=`<div class="twist-result"><div class="twist-result-name">${d.twist_name||'The Twist'}</div><div class="twist-result-tagline">${d.tagline||''}</div><div class="twist-changes-title">Changes</div>${changes}${newStep}<div class="twist-note">${d.bartender_note||''}</div></div>`;
    btn.textContent='✦ Suggest Another Twist';btn.disabled=false;
  }catch(e){
    resultEl.innerHTML='';btn.textContent='✦ Suggest a Twist';btn.disabled=false;
    const err=document.createElement('div');err.style.cssText='color:var(--danger);font-size:.78rem;margin-top:6px;text-align:center';err.textContent='Couldn\'t connect. Try again.';resultEl.appendChild(err);
  }
}

// Scroll to card from index
function scrollToCard(id){currentView='cards';openCards.add(id);renderAll();setTimeout(()=>{const el=document.getElementById('card-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('highlight');setTimeout(()=>el.classList.remove('highlight'),2000)}},100)}

// Render cards view
function renderCards(){const list=filtered();const el=document.getElementById('cardsContainer');if(list.length===0){el.innerHTML='<div class="no-results"><h3>No cocktails found</h3><p>Try adjusting your filters or search</p></div>';return}el.innerHTML=list.map(c=>cardHTML(c)).join('')}

// Render A-Z index
function renderIndex(){const list=filtered().sort((a,b)=>a.name.localeCompare(b.name));const el=document.getElementById('indexContainer');let html='';let letter='';list.forEach(c=>{const fl=c.name[0].toUpperCase();if(fl!==letter){letter=fl;html+=`<div class="index-letter">${letter}</div>`}html+=`<div class="index-item" onclick="scrollToCard('${c.id}')"><span class="name">${c.name}</span><span class="cat">${c.category}</span></div>`});el.innerHTML=html||'<div class="no-results"><h3>No cocktails found</h3></div>'}

// Render category index
function renderCatIndex(){const list=filtered();const el=document.getElementById('catContainer');const groups={};list.forEach(c=>{if(!groups[c.category])groups[c.category]=[];groups[c.category].push(c)});let html='';Object.keys(groups).sort().forEach(cat=>{html+=`<div class="cat-header">${cat} (${groups[cat].length})</div>`;groups[cat].sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{html+=`<div class="cat-item" onclick="scrollToCard('${c.id}')"><span class="name">${c.name}</span><span class="diff ${c.difficulty}">${c.difficulty}</span></div>`})});el.innerHTML=html||'<div class="no-results"><h3>No cocktails found</h3></div>'}

function renderFavView(){const el=document.getElementById('favContainer');const favList=cocktails.filter(c=>favorites.has(c.id));if(favList.length===0){el.innerHTML='<div class="fav-empty"><div class="icon">♡</div><h3>No favorites yet</h3><p>Tap the heart on any cocktail to add it here.<br>Your favorites are saved and will persist between visits.</p></div>';return}el.innerHTML='<div class="fav-grid">'+favList.map(c=>cardHTML(c)).join('')+'</div>'}
function renderAll(){
  renderCards();renderFavView();renderMoodView();renderCOTW();
  document.getElementById('cardsContainer').classList.toggle('hidden',currentView!=='cards');
  document.getElementById('favContainer').classList.toggle('active',currentView==='favorites');
  document.getElementById('moodView').classList.toggle('active',currentView==='mood');
  // Bottom nav active state + favorites badge
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===currentView));
  const badge=document.getElementById('favBadge');if(badge){const n=favorites.size;badge.textContent=n;badge.classList.toggle('visible',n>0)}
  // Count
  const isFav=currentView==='favorites';
  const count=isFav?favorites.size:filtered().length;
  const el=document.getElementById('countDisplay');
  if(el)el.textContent=currentView==='cards'?count+' cocktail'+(count!==1?'s':''):currentView==='favorites'?count+' favorite'+(count!==1?'s':''):'';
}

// Pantry
function renderPantry(){const el=document.getElementById('pantryItems');el.innerHTML='';Array.from(pantryItems).forEach(p=>{const div=document.createElement('div');div.className='pantry-item';div.onclick=()=>{pantryItems.delete(p);renderPantry();renderAll()};const nameSpan=document.createElement('span');nameSpan.textContent=p;const removeSpan=document.createElement('span');removeSpan.className='remove';removeSpan.textContent='×';div.appendChild(nameSpan);div.appendChild(removeSpan);el.appendChild(div)})}

// Menu Studio
const OCCASIONS=[
  {emoji:'🔥',label:'BBQ Night',prompt:'A summer BBQ evening with friends, grilling outdoors'},
  {emoji:'❤️',label:'Date Night',prompt:'A romantic dinner for two, intimate and elegant'},
  {emoji:'🇮🇱',label:'Yom Ha\'atzmaut',prompt:'Israeli Independence Day celebration, festive and joyful'},
  {emoji:'🕯️',label:'Shabbat',prompt:'A relaxed Friday night Shabbat dinner, warm and welcoming'},
  {emoji:'☀️',label:'Summer Lunch',prompt:'A hot summer afternoon lunch, refreshing and light'},
  {emoji:'🎉',label:'House Party',prompt:'A lively house party with a crowd, fun and energetic'},
  {emoji:'🍂',label:'Cozy Winter',prompt:'A cold winter evening at home, warming and cozy'},
  {emoji:'🌸',label:'Spring Garden',prompt:'A spring afternoon in the garden, fresh and floral'},
];

let studioMenuItems=[], lastAIResult=null;

function openStudio(){document.getElementById('studioModal').classList.add('open')}
function closeStudio(){document.getElementById('studioModal').classList.remove('open')}

function renderOccasionChips(){
  const el=document.getElementById('occasionChips');
  el.innerHTML=OCCASIONS.map(o=>`<div class="occasion-chip" data-prompt="${o.prompt}">${o.emoji} ${o.label}</div>`).join('');
  el.querySelectorAll('.occasion-chip').forEach(c=>c.onclick=()=>{
    el.querySelectorAll('.occasion-chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    document.getElementById('studioPrompt').value=c.dataset.prompt;
  });
}

async function generateMenu(){
  const prompt=document.getElementById('studioPrompt').value.trim();
  if(!prompt)return;
  const btn=document.getElementById('studioGenerateBtn');
  btn.disabled=true;
  document.getElementById('studioResult').innerHTML=`<div class="studio-loading"><div class="studio-loading-icon">🍸</div><div class="studio-loading-text">Crafting your menu...</div></div>`;
  const condensed=cocktails.map(c=>({id:c.id,name:c.name,category:c.category,difficulty:c.difficulty,description:c.description,flavor:c.flavor||[],tags:c.tags||[]}));
  try{
    const res=await fetch('/api/menu',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,cocktailList:condensed})});
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    renderAIResult(data);
  }catch(e){
    document.getElementById('studioResult').innerHTML=`<div style="text-align:center;padding:24px;color:var(--danger)">Something went wrong. Try again.</div>`;
  }finally{btn.disabled=false}
}

function renderAIResult(data){
  lastAIResult=data;
  studioMenuItems=[];
  const existingCocktails=(data.cocktails||[]).map(item=>{
    const c=cocktails.find(x=>x.id===item.id);
    if(!c)return'';
    studioMenuItems.push(c);
    return`<div class="ai-cocktail-card">
      <div class="ai-cocktail-name">${c.name}</div>
      <div class="ai-cocktail-meta">${c.category} · ${c.difficulty}</div>
      <div class="ai-cocktail-note">${item.note}</div>
      <div class="ai-cocktail-actions">
        <button class="ai-go-btn" onclick="closeStudio();scrollToCard('${c.id}')">View Recipe →</button>
      </div>
    </div>`;
  }).join('');
  const specials=(data.specials||[]).map(s=>{
    const specialCocktail={id:'special-'+Date.now()+Math.random(),name:s.name,description:s.description,category:s.category||'special',glass:s.glass||'coupe',garnish:s.garnish||'',difficulty:s.difficulty||'medium',flavor:s.flavor||[],ingredients:s.ingredients||[],steps:s.steps||[],tags:['special','ai-generated'],isSpecial:true};
    studioMenuItems.push(specialCocktail);
    const ings=(s.ingredients||[]).map(i=>`<div class="ai-ingredient"><span>${i.name}</span><span class="ai-ingredient-amount">${convertUnit(i.amount,1)}</span></div>`).join('');
    const steps=(s.steps||[]).map((st,i)=>`<div style="font-size:.78rem;padding:3px 0;color:var(--text)"><span style="color:var(--gold);font-weight:600">${i+1}.</span> ${st.instruction}</div>`).join('');
    return`<div class="ai-cocktail-card">
      <div class="ai-special-badge">✦ Chef's Special</div>
      <div class="ai-cocktail-name">${s.name}</div>
      <div class="ai-cocktail-meta">${s.category||'special'} · ${s.glass||'coupe'} · garnish: ${s.garnish||'—'}</div>
      <div class="ai-cocktail-note">${s.note}</div>
      <div class="ai-cocktail-note" style="margin-top:4px;font-style:italic">${s.description}</div>
      <div class="ai-ingredients">${ings}</div>
      <div style="margin-top:8px">${steps}</div>
    </div>`;
  }).join('');
  document.getElementById('studioResult').innerHTML=`<div class="ai-result">
    <div class="ai-menu-header">
      <div class="ai-menu-title">${data.title||'Your Menu'}</div>
      <div class="ai-menu-subtitle">${data.subtitle||''}</div>
      ${data.occasion_note?`<div class="ai-menu-note">${data.occasion_note}</div>`:''}
    </div>
    <div class="ai-section-title">From The Bar Book</div>${existingCocktails}
    <div class="ai-section-title">Chef's Specials ✦</div>${specials}
    <button class="studio-print-btn" onclick="buildPrintMenu();switchStudioTab('print')">🖨️ Build Print Menu</button>
  </div>`;
}

function buildPrintMenu(){
  document.getElementById('menuTitle').value=document.querySelector('.ai-menu-title')?.textContent||'The Bar Book';
  document.getElementById('menuSubtitle').value=document.querySelector('.ai-menu-subtitle')?.textContent||'';
  document.getElementById('menuItemsList').innerHTML=studioMenuItems.map(c=>`
    <div class="menu-item">
      <div class="menu-item-row"><span class="menu-item-name">${c.name}</span><span class="menu-item-cat">${c.category}</span></div>
      <div class="menu-item-desc">${c.description}</div>
      <div class="menu-item-tags">${(c.flavor||[]).map(f=>`<span class="menu-item-tag">${f}</span>`).join('')}${c.isSpecial?'<span class="menu-item-tag" style="background:rgba(184,106,16,.15);color:var(--gold)">✦ special</span>':''}</div>
    </div>`).join('');
}

function switchStudioTab(tab){
  document.querySelectorAll('.studio-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.getElementById('studioAiTab').style.display=tab==='ai'?'block':'none';
  document.getElementById('studioPrintTab').style.display=tab==='print'?'block':'none';
}

document.getElementById('studioClose').onclick=closeStudio;
document.getElementById('menuToggle').onclick=()=>{openStudio();renderOccasionChips()};
document.getElementById('studioGenerateBtn').onclick=generateMenu;
document.querySelectorAll('.studio-tab').forEach(t=>t.onclick=()=>switchStudioTab(t.dataset.tab));

document.getElementById('pantryAdd').onclick=()=>{const v=document.getElementById('pantryInput').value.trim();if(v){pantryItems.add(v);document.getElementById('pantryInput').value='';renderPantry();renderAll()}};
document.getElementById('pantryInput').onkeydown=e=>{if(e.key==='Enter')document.getElementById('pantryAdd').click()};
document.getElementById('bbToggle').onclick=()=>{showBarBook=!showBarBook;document.getElementById('bbToggle').classList.toggle('active',showBarBook);renderAll()};
document.getElementById('pantryToggle').onclick=()=>{showPantry=!showPantry;document.getElementById('pantryToggle').classList.toggle('active',showPantry);document.getElementById('pantrySection').classList.toggle('active',showPantry);renderAll()};
document.querySelectorAll('.unit-opt').forEach(b=>b.onclick=()=>{useMl=b.dataset.unit==='ml';localStorage.setItem('barbook-unit',useMl?'ml':'oz');document.querySelectorAll('.unit-opt').forEach(x=>x.classList.toggle('active',x.dataset.unit===(useMl?'ml':'oz')));renderAll();if(lastAIResult)renderAIResult(lastAIResult)});
document.querySelectorAll('.unit-opt').forEach(x=>x.classList.toggle('active',x.dataset.unit===(useMl?'ml':'oz')));
document.getElementById('search').oninput=e=>{searchQuery=e.target.value;renderAll()};
document.querySelectorAll('.nav-tab').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;renderAll()});

// Init
renderPills();renderDiffs();renderAll();
</script>

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
