<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dror's Bar Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a1628;--card:#0f1d32;--card-hover:#142642;--gold:#c9a96e;--gold-dim:#8a7346;--text:#e8e0d4;--text-dim:#8a9ab5;--accent:#1a2d4d;--border:#1a2d4d;--success:#4ade80;--danger:#f87171;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{background:var(--bg);min-height:100vh;padding-top:var(--safe-top);padding-bottom:calc(60px + var(--safe-bottom))}
h1,h2,h3{font-family:'Playfair Display',serif}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(10,22,40,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 16px 8px;padding-top:calc(12px + var(--safe-top));border-bottom:1px solid var(--border)}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.header h1{font-size:1.4rem;color:var(--gold);letter-spacing:.5px}
.header-actions{display:flex;gap:8px}
.header-btn{background:none;border:1px solid var(--border);color:var(--text-dim);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;transition:all .2s}
.header-btn.active{color:var(--gold);border-color:var(--gold)}

/* Search */
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;background:var(--accent);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:.9rem;outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--gold)}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:1rem}

/* View Toggle */
.view-toggle{display:flex;gap:4px;margin-bottom:8px}
.view-btn{flex:1;padding:6px 0;background:var(--accent);border:1px solid var(--border);color:var(--text-dim);font-size:.75rem;font-weight:500;cursor:pointer;transition:all .2s;text-align:center}
.view-btn:first-child{border-radius:8px 0 0 8px}
.view-btn:last-child{border-radius:0 8px 8px 0}
.view-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}

/* Category pills */
.pills{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;-ms-overflow-style:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:6px 14px;background:var(--accent);border:1px solid var(--border);border-radius:20px;color:var(--text-dim);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s;flex-shrink:0}
.pill.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}

/* Difficulty chips */
.diff-row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.diff-chip{padding:4px 10px;border-radius:12px;font-size:.7rem;font-weight:500;cursor:pointer;border:1px solid var(--border);color:var(--text-dim);background:var(--accent);transition:all .2s}
.diff-chip.active{border-color:var(--gold);color:var(--gold)}

/* Flavor tags */
.flavor-row{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.flavor-row::-webkit-scrollbar{display:none}
.flavor-tag{white-space:nowrap;padding:3px 10px;border-radius:10px;font-size:.68rem;background:rgba(201,169,110,.1);color:var(--gold-dim);cursor:pointer;transition:all .2s;border:1px solid transparent;flex-shrink:0}
.flavor-tag.active{background:rgba(201,169,110,.25);color:var(--gold);border-color:var(--gold)}

/* Cards Grid */
.cards{padding:8px 16px 20px;display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.cards{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.cards{grid-template-columns:1fr 1fr 1fr}}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .25s;transform:scale(1)}
.card:active{transform:scale(.97)}
.card.highlight{border-color:var(--gold);box-shadow:0 0 20px rgba(201,169,110,.15)}
.card-top{padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:flex-start}
.card-info h3{font-size:1.05rem;color:var(--text);margin-bottom:3px}
.card-info p{font-size:.78rem;color:var(--text-dim);line-height:1.4}
.card-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:8px;font-size:.65rem;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.badge-cat{background:rgba(201,169,110,.15);color:var(--gold)}
.badge-diff{background:rgba(138,154,181,.15);color:var(--text-dim)}
.badge-diff.easy{color:#4ade80}.badge-diff.medium{color:#facc15}.badge-diff.hard{color:#f87171}
.card-fav{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-dim);transition:all .2s;padding:4px;flex-shrink:0}
.card-fav.active{color:#ef4444}

/* Card expanded */
.card-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.card.open .card-body{max-height:2000px}
.card-detail{padding:0 16px 16px}
.info-boxes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.info-box{background:var(--accent);border-radius:10px;padding:10px;text-align:center}
.info-box .label{font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:4px}
.info-box .value{font-size:.82rem;font-weight:500;color:var(--text)}
.info-box .icon{font-size:1.3rem;margin-bottom:2px}
.section-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);margin:12px 0 8px;font-weight:600}
.ingredient{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(26,45,77,.5);font-size:.85rem}
.ingredient .name{color:var(--text)}.ingredient .amount{color:var(--gold);font-weight:500;white-space:nowrap}
.ingredient.optional .name{color:var(--text-dim);font-style:italic}
.step{display:flex;gap:10px;padding:8px 0;font-size:.83rem;color:var(--text)}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;flex-shrink:0}
.step-text{line-height:1.5}
.flavor-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.flavor-pill{padding:3px 8px;border-radius:8px;font-size:.65rem;background:rgba(201,169,110,.1);color:var(--gold-dim)}
.tag-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag-pill{padding:3px 8px;border-radius:8px;font-size:.65rem;background:rgba(138,154,181,.1);color:var(--text-dim)}

/* Index View */
.index-view{padding:8px 16px 20px;display:none}
.index-view.active{display:block}
.cards-view{display:grid}.cards-view.hidden{display:none}
.index-letter{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold);padding:12px 0 6px;border-bottom:1px solid var(--border);margin-top:8px}
.index-item{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(26,45,77,.3);cursor:pointer;transition:background .15s}
.index-item:active{background:var(--accent)}
.index-item .name{font-size:.9rem;font-weight:500}
.index-item .cat{font-size:.72rem;color:var(--text-dim);text-transform:capitalize}

/* Category Index */
.cat-view{padding:8px 16px 20px;display:none}
.cat-view.active{display:block}
.cat-header{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--gold);padding:14px 0 6px;border-bottom:1px solid var(--border);text-transform:capitalize;margin-top:6px}
.cat-item{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(26,45,77,.3);cursor:pointer;transition:background .15s}
.cat-item:active{background:var(--accent)}
.cat-item .name{font-size:.88rem;font-weight:500}
.cat-item .diff{font-size:.7rem}

/* Pantry Feature */
.pantry-section{padding:0 16px 12px;display:none}
.pantry-section.active{display:block}
.pantry-input-row{display:flex;gap:6px;margin-bottom:8px}
.pantry-input{flex:1;padding:8px 12px;background:var(--accent);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.85rem;outline:none}
.pantry-input:focus{border-color:var(--gold)}
.pantry-add-btn{padding:8px 16px;background:var(--gold);color:var(--bg);border:none;border-radius:10px;font-weight:600;font-size:.85rem;cursor:pointer}
.pantry-items{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.pantry-item{padding:4px 10px;background:rgba(201,169,110,.15);color:var(--gold);border-radius:8px;font-size:.75rem;display:flex;align-items:center;gap:4px;cursor:pointer}
.pantry-item .remove{font-weight:bold}
.match-pct{font-size:.7rem;color:var(--success);font-weight:600;margin-left:auto;padding-left:8px}

/* No results */
.no-results{text-align:center;padding:40px 20px;color:var(--text-dim)}
.no-results h3{font-size:1.1rem;margin-bottom:8px;color:var(--text)}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,22,40,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:6px 0;padding-bottom:calc(6px + var(--safe-bottom));display:flex;justify-content:center;z-index:100}
.nav-count{font-size:.75rem;color:var(--text-dim);text-align:center;padding:4px}

/* Scrollbar */
::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <h1>Dror's Bar Book</h1>
    <div class="header-actions">
      <button class="header-btn" id="pantryToggle" title="What can I make?">🧊</button>
      <button class="header-btn" id="favToggle" title="Favorites">♡</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input type="text" id="search" placeholder="Search cocktails, ingredients..." autocomplete="off" autocorrect="off" autocapitalize="off">
  </div>
  <div class="view-toggle">
    <button class="view-btn active" data-view="cards">Cards</button>
    <button class="view-btn" data-view="index">A-Z Index</button>
    <button class="view-btn" data-view="category">By Category</button>
  </div>
  <div class="pills" id="categoryPills"></div>
  <div class="diff-row" id="diffRow"></div>
  <div class="flavor-row" id="flavorRow"></div>
</div>

<div class="pantry-section" id="pantrySection">
  <div class="pantry-input-row">
    <input type="text" class="pantry-input" id="pantryInput" placeholder="Add ingredient (e.g. bourbon)..." autocomplete="off">
    <button class="pantry-add-btn" id="pantryAdd">Add</button>
  </div>
  <div class="pantry-items" id="pantryItems"></div>
</div>

<div class="cards cards-view" id="cardsContainer"></div>
<div class="index-view" id="indexContainer"></div>
<div class="cat-view" id="catContainer"></div>

<div class="bottom-nav">
  <div class="nav-count" id="countDisplay">85 cocktails</div>
</div>

,"required":true},{"name":"soda water","amount":"4 oz","required":true}],"steps":[{"instruction":"Fill a highball glass with ice"},{"instruction":"Add scotch"},{"instruction":"Top with soda water"},{"instruction":"Garnish with a lemon twist"}],"spirit_base":["scotch"],"tags":["classic","built","refreshing"],"flavor":["smoky","clean","crisp","refreshing"]},{"id":"cognac-sidecar","name":"Cognac Sidecar","category":"cognac","difficulty":"medium","glass":"coupe","garnish":"Sugar rim, lemon twist","description":"The definitive Sidecar — rich cognac with citrus elegance","ingredients":[{"name":"cognac","amount":"2 oz","required":true},{"name":"cointreau","amount":"0.75 oz","required":true},{"name":"lemon juice","amount":"0.75 oz","required":true}],"steps":[{"instruction":"Sugar the rim of a coupe glass"},{"instruction":"Add all ingredients to a shaker with ice"},{"instruction":"Shake vigorously"},{"instruction":"Strain into the prepared glass"},{"instruction":"Garnish with a lemon twist"}],"spirit_base":["cognac"],"tags":["classic","shaken","sour"],"flavor":["citrus","rich","sweet","elegant"]},{"id":"jack-rose","name":"Jack Rose","category":"brandy","difficulty":"easy","glass":"coupe","garnish":"Lime wheel","description":"A beautiful pink cocktail made with apple brandy","ingredients":[{"name":"applejack","amount":"2 oz","required":true},{"name":"lime juice","amount":"0.75 oz","required":true},{"name":"grenadine","amount":"0.5 oz","required":true}],"steps":[{"instruction":"Add all ingredients to a shaker with ice"},{"instruction":"Shake vigorously"},{"instruction":"Strain into a chilled coupe"},{"instruction":"Garnish with a lime wheel"}],"spirit_base":["applejack","brandy"],"tags":["classic","shaken","sour"],"flavor":["apple","citrus","sweet","crisp"]},{"id":"cable-car","name":"Cable Car","category":"rum","difficulty":"medium","glass":"coupe","garnish":"Cinnamon sugar rim, orange twist","description":"A spiced rum sour with cinnamon and orange","ingredients":[{"name":"spiced rum","amount":"1.5 oz","required":true},{"name":"orange curaçao","amount":"0.75 oz","required":true},{"name":"lemon juice","amount":"1 oz","required":true},{"name":"simple syrup","amount":"0.25 oz","required":true}],"steps":[{"instruction":"Rim a coupe with cinnamon sugar"},{"instruction":"Add all ingredients to a shaker with ice"},{"instruction":"Shake vigorously"},{"instruction":"Strain into the prepared glass"},{"instruction":"Garnish with an orange twist"}],"spirit_base":["rum"],"tags":["modern","shaken","sour"],"flavor":["citrus","spicy","sweet","warm"]}];

// Glass emoji mapping
const glassEmoji={rocks:'🥃',coupe:'🍸',highball:'🥂',flute:'🥂',collins:'🥂',hurricane:'🍹','copper mug':'🍺','julep cup':'🥃','irish coffee mug':'☕',mug:'☕',wine:'🍷',shot:'🥃'};

// Detect ice type from steps/ingredients
function detectIce(c){const t=(c.steps||[]).map(s=>s.instruction).join(' ').toLowerCase()+(c.ingredients||[]).map(i=>i.name).join(' ').toLowerCase();if(t.includes('crushed ice'))return'Crushed';if(t.includes('large cube')||t.includes('large ice'))return'Large cube';if(t.includes('no ice')||t.includes('neat')||t.includes('(neat)'))return'Neat';if(t.includes('blender'))return'Blended';if(c.glass==='shot')return'None';if(t.includes('ice'))return'Cubed';return'As needed'}

// State
let currentView='cards',activeCategory='all',activeDifficulty=null,activeFlavor=null,showFavs=false,showPantry=false,favorites=new Set(),pantryItems=new Set(),searchQuery='',openCards=new Set();

// Get all categories, flavors
const categories=['all',...[...new Set(cocktails.map(c=>c.category))]];
const allFlavors=[...new Set(cocktails.flatMap(c=>c.flavor||[]))].sort();
const difficulties=['easy','medium','hard'];

// Render category pills
function renderPills(){const el=document.getElementById('categoryPills');el.innerHTML=categories.map(c=>`<div class="pill${activeCategory===c?' active':''}" data-cat="${c}">${c==='all'?'All':c.charAt(0).toUpperCase()+c.slice(1)}</div>`).join('');el.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{activeCategory=p.dataset.cat;renderPills();renderAll()})}

// Render difficulty chips
function renderDiffs(){const el=document.getElementById('diffRow');el.innerHTML=difficulties.map(d=>`<div class="diff-chip${activeDifficulty===d?' active':''}" data-diff="${d}">${d.charAt(0).toUpperCase()+d.slice(1)}</div>`).join('');el.querySelectorAll('.diff-chip').forEach(p=>p.onclick=()=>{activeDifficulty=activeDifficulty===p.dataset.diff?null:p.dataset.diff;renderDiffs();renderAll()})}

// Render flavor tags
function renderFlavors(){const el=document.getElementById('flavorRow');el.innerHTML=allFlavors.map(f=>`<div class="flavor-tag${activeFlavor===f?' active':''}" data-fl="${f}">${f}</div>`).join('');el.querySelectorAll('.flavor-tag').forEach(p=>p.onclick=()=>{activeFlavor=activeFlavor===p.dataset.fl?null:p.dataset.fl;renderFlavors();renderAll()})}

// Filter cocktails
function filtered(){let list=cocktails;if(showFavs)list=list.filter(c=>favorites.has(c.id));if(activeCategory!=='all')list=list.filter(c=>c.category===activeCategory);if(activeDifficulty)list=list.filter(c=>c.difficulty===activeDifficulty);if(activeFlavor)list=list.filter(c=>(c.flavor||[]).includes(activeFlavor));if(searchQuery){const q=searchQuery.toLowerCase();list=list.filter(c=>c.name.toLowerCase().includes(q)||c.description.toLowerCase().includes(q)||(c.ingredients||[]).some(i=>i.name.toLowerCase().includes(q))||(c.category||'').toLowerCase().includes(q))}if(showPantry&&pantryItems.size>0){list=list.map(c=>{const req=c.ingredients.filter(i=>i.required);const matched=req.filter(i=>Array.from(pantryItems).some(p=>i.name.toLowerCase().includes(p.toLowerCase())||p.toLowerCase().includes(i.name.toLowerCase().split(' ').pop())));return{...c,matchPct:Math.round(matched.length/req.length*100)}}).filter(c=>c.matchPct>0).sort((a,b)=>b.matchPct-a.matchPct)}return list}

// Render card
function cardHTML(c){const ice=detectIce(c);const ge=glassEmoji[c.glass]||'🍸';const isFav=favorites.has(c.id);const isOpen=openCards.has(c.id);
return`<div class="card${isOpen?' open':''}" id="card-${c.id}" data-id="${c.id}">
<div class="card-top" onclick="toggleCard('${c.id}')">
<div class="card-info"><h3>${c.name}</h3><p>${c.description}</p>
<div class="card-badges"><span class="badge badge-cat">${c.category}</span><span class="badge badge-diff ${c.difficulty}">${c.difficulty}</span>${c.matchPct?`<span class="match-pct">${c.matchPct}% match</span>`:''}</div></div>
<button class="card-fav${isFav?' active':''}" onclick="event.stopPropagation();toggleFav('${c.id}')">${isFav?'❤️':'♡'}</button></div>
<div class="card-body"><div class="card-detail">
<div class="info-boxes"><div class="info-box"><div class="icon">${ge}</div><div class="label">Glass</div><div class="value">${c.glass}</div></div>
<div class="info-box"><div class="icon">🧊</div><div class="label">Ice</div><div class="value">${ice}</div></div>
<div class="info-box"><div class="icon">🌿</div><div class="label">Garnish</div><div class="value">${c.garnish||'None'}</div></div></div>
<div class="section-title">Ingredients</div>${(c.ingredients||[]).map(i=>`<div class="ingredient${i.required?'':' optional'}"><span class="name">${i.name}${i.required?'':' (optional)'}</span><span class="amount">${i.amount}</span></div>`).join('')}
<div class="section-title">Method</div>${(c.steps||[]).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div class="step-text">${s.instruction}</div></div>`).join('')}
<div class="section-title">Flavor Profile</div><div class="flavor-pills">${(c.flavor||[]).map(f=>`<span class="flavor-pill">${f}</span>`).join('')}</div>
<div class="section-title">Tags</div><div class="tag-pills">${(c.tags||[]).map(t=>`<span class="tag-pill">${t}</span>`).join('')}</div>
</div></div></div>`}

function toggleCard(id){if(openCards.has(id))openCards.delete(id);else openCards.add(id);renderAll()}
function toggleFav(id){if(favorites.has(id))favorites.delete(id);else favorites.add(id);renderAll()}

// Scroll to card from index
function scrollToCard(id){currentView='cards';openCards.add(id);document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view==='cards'));renderAll();setTimeout(()=>{const el=document.getElementById('card-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('highlight');setTimeout(()=>el.classList.remove('highlight'),2000)}},100)}

// Render cards view
function renderCards(){const list=filtered();const el=document.getElementById('cardsContainer');if(list.length===0){el.innerHTML='<div class="no-results"><h3>No cocktails found</h3><p>Try adjusting your filters or search</p></div>';return}el.innerHTML=list.map(c=>cardHTML(c)).join('')}

// Render A-Z index
function renderIndex(){const list=filtered().sort((a,b)=>a.name.localeCompare(b.name));const el=document.getElementById('indexContainer');let html='';let letter='';list.forEach(c=>{const fl=c.name[0].toUpperCase();if(fl!==letter){letter=fl;html+=`<div class="index-letter">${letter}</div>`}html+=`<div class="index-item" onclick="scrollToCard('${c.id}')"><span class="name">${c.name}</span><span class="cat">${c.category}</span></div>`});el.innerHTML=html||'<div class="no-results"><h3>No cocktails found</h3></div>'}

// Render category index
function renderCatIndex(){const list=filtered();const el=document.getElementById('catContainer');const groups={};list.forEach(c=>{if(!groups[c.category])groups[c.category]=[];groups[c.category].push(c)});let html='';Object.keys(groups).sort().forEach(cat=>{html+=`<div class="cat-header">${cat} (${groups[cat].length})</div>`;groups[cat].sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{html+=`<div class="cat-item" onclick="scrollToCard('${c.id}')"><span class="name">${c.name}</span><span class="diff ${c.difficulty}">${c.difficulty}</span></div>`})});el.innerHTML=html||'<div class="no-results"><h3>No cocktails found</h3></div>'}

function renderAll(){renderCards();renderIndex();renderCatIndex();
document.getElementById('cardsContainer').classList.toggle('hidden',currentView!=='cards');
document.getElementById('indexContainer').classList.toggle('active',currentView==='index');
document.getElementById('catContainer').classList.toggle('active',currentView==='category');
const count=filtered().length;document.getElementById('countDisplay').textContent=count+' cocktail'+(count!==1?'s':'')}

// Pantry
function renderPantry(){const el=document.getElementById('pantryItems');el.innerHTML=Array.from(pantryItems).map(p=>`<div class="pantry-item" onclick="pantryItems.delete('${p}');renderPantry();renderAll()"><span>${p}</span><span class="remove">×</span></div>`).join('')}

document.getElementById('pantryAdd').onclick=()=>{const v=document.getElementById('pantryInput').value.trim();if(v){pantryItems.add(v);document.getElementById('pantryInput').value='';renderPantry();renderAll()}};
document.getElementById('pantryInput').onkeydown=e=>{if(e.key==='Enter')document.getElementById('pantryAdd').click()};
document.getElementById('pantryToggle').onclick=()=>{showPantry=!showPantry;document.getElementById('pantryToggle').classList.toggle('active',showPantry);document.getElementById('pantrySection').classList.toggle('active',showPantry);renderAll()};
document.getElementById('favToggle').onclick=()=>{showFavs=!showFavs;document.getElementById('favToggle').classList.toggle('active',showFavs);document.getElementById('favToggle').textContent=showFavs?'❤️':'♡';renderAll()};
document.getElementById('search').oninput=e=>{searchQuery=e.target.value;renderAll()};
document.querySelectorAll('.view-btn').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;document.querySelectorAll('.view-btn').forEach(x=>x.classList.toggle('active',x===b));renderAll()});

// Init
renderPills();renderDiffs();renderFlavors();renderAll();
</script>
</body>
</html>
